# NGINX Configuration for QUAN AI BRAIN
# Place in /etc/nginx/sites-available/quanai

upstream quanai_api {
    server 127.0.0.1:8216;
    keepalive 32;
    keepalive_timeout 60;
}

upstream quanai_dashboard {
    server 127.0.0.1:8765;
}

upstream quanai_responder {
    server 127.0.0.1:18036;
}

# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name quanai.company.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name quanai.company.com;
    
    # SSL Configuration
    ssl_certificate /etc/ssl/certs/quanai.company.com.crt;
    ssl_certificate_key /etc/ssl/private/quanai.company.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Logging
    access_log /var/log/nginx/quanai_access.log;
    error_log /var/log/nginx/quanai_error.log;
    
    # Client body size
    client_max_body_size 10M;
    
    # API Server
    location /api/ {
        proxy_pass http://quanai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
    }
    
    # Dashboard
    location /dashboard/ {
        proxy_pass http://quanai_dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Responder
    location /responder/ {
        proxy_pass http://quanai_responder/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;  # Longer for chat responses
    }
    
    # Static files
    location /static/ {
        alias /var/www/quanai/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Gzip
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }
    
    # Media files
    location /media/ {
        alias /var/www/quanai/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Health check (no auth)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req zone=api_limit burst=200 nodelay;
    
    # Connection limits
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn conn_limit 10;
}

# WebSocket support (if needed)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Additional server for internal monitoring
server {
    listen 127.0.0.1:9090;
    server_name localhost;
    
    location /metrics {
        proxy_pass http://127.0.0.1:8216/metrics;
        proxy_set_header Host $host;
    }
}